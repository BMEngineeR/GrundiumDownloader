name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set one of these two repository secrets (see README "Code review"):
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff` and open the
            changed files for context. This is a Node.js CLI that drives the
            grundium.net web app with Puppeteer and downloads slide files, so pay
            attention to: correctness, data loss (manifest, scans.csv, partial
            downloads), credential handling, and anything that could change state
            on the scanner by accident.

            Report only real problems: bugs, security issues, missing error handling
            that would bite a user. Skip style nits. Post each finding as an inline
            comment on the relevant line. Then post one short summary comment with
            `gh pr comment`; if you found nothing, say so in one sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
